{% extends "ToDoApp/layout.html" %}

{% block title %} Confirmă Ștergerea {% endblock %}

{% block content %}

<style>


</style>

<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        
        <div class="card shadow-sm border-0 p-4 text-center" style="border-radius: 12px; background-color: #FAFAF8;">

            <h4 class="text fw-semibold mb-3" style = "color: #2c3d39;">Are you sure you want to delete the task:</h4>
            <p class="text-muted small mb-3">
                <strong class="text fs-4 " style = "color: #2c3d39;">"{{ task.task_name }}" ?</strong> <br>
                <p class = "pt-1 fs-5" style = "color: #2c3d39;">This action cannot be undone. </p>
            </p>

            <!-- Formularul de confirmare -->
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <!-- Buton Anulare (înapoi pe main_page) -->
                    <a href="{% url 'main_page' %}" class="btn btn-outline-secondary px-4 py-2 fw-semibold" style="border-radius: 8px; color: #2c3d39;">
                        Give Up
                    </a>

                    <!-- Buton Confirmă Ștergerea -->
                    <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold" style="border-radius: 8px;">
                        Yes, Delete
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
{% endblock %}

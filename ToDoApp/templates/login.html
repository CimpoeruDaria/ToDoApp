{% extends "ToDoApp/layout.html" %}

{% block title %} Login {% endblock %}

{% block content %} 

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
    }

    .btn-login{
        background-color: #3B524D;
        font-size: 20px;
        padding: 10px;
        color: rgb(232, 231, 231);
    }

    .btn-login:hover{
      background-color: #455d59;
      color: rgb(250, 249, 249);
    }

    .link-create-account{
        color: #5e7e78;
    }

    .link-create-account:hover{
        color: #4f6d66;
    }

    .text{
        color: #2c3d39;
    }

    .form-control:focus{
        border-color: #3B5550; 
        box-shadow: 0 0 0 0.25rem rgba(59, 85, 80, 0.25); 
        outline: 0;
    }

</style>

<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow-sm p-4">
            <h3 class="text-center mb-3 fw-bold" style = "color: #2c3d39">Connect</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-start">
                    <label for="{{ form.username.id_for_label }}" class="text form-label fw-semibold">Username:</label>
                    <input type="text" 
                        name="{{ form.username.name }}" 
                        id="{{ form.username.id_for_label }}" 
                        class="form-control" 
                        placeholder="username"
                        required>
                </div>

                <div class="mb-4 text-start">
                    <label for="{{ form.password.id_for_label }}" class="text form-label fw-semibold">Password:</label>
                    <input type="password" 
                        name="{{ form.password.name }}" 
                        id="{{ form.password.id_for_label }}" 
                        class="form-control" 
                        placeholder="password"
                        required>
                </div>
                <button type="submit" class="btn btn-login w-100 fw-semibold"> Login </button>
            </form>
            <p class="mt-3 text-center text-muted">
                Don't you have an account yet? <br> <a class = "link-create-account" href="{% url 'register' %}">Create Account</a>.
            </p>
        </div>
    </div>
</div>

{% endblock %}

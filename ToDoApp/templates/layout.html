<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} To Do App {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
        .btn-primary{
            background-color: #5e7e78;
            border: #5e7e78;
            padding: 4px;
            padding-left: 6px;
            padding-right: 6px;
        }

        .btn-primary:hover{
            background-color: rgb(223, 223, 223);
            color: #5e7e78;
        }
        
         body{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 700;
        }


    </style>
</head>
<body class = "bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="{% url 'login' %}" >ToDo App</a>
            <div class="ms-auto d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="text-white me-3">Hello, <strong>{{ user.username }}</strong>!</span>
                    <form method="POST" action="{% url 'logout' %}" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Disconnect</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2"> Login </a>
                    <a href="{% url 'register' %}" class="btn btn-primary"> New Account </a>
                {% endif %}
            </div>
        </div>
    </nav>
    <!--Continutul fiecarei pagini (ce se schimba din fiecare webpage)-->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>

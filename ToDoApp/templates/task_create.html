{% extends 'ToDoApp/layout.html' %}

{% block title %} Add New Task {% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        
        <div class="card shadow-sm border-0 p-4" style="border-radius: 12px; background-color: #FAFAF8;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="fw-semibold mb-0" style="color: #1C1C1C;">New Task</h3>
                <a href="{% url 'main_page' %}" class="btn btn-sm btn-outline-secondary rounded-pill">
                    Back to Main Page
                </a>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3 text-start">
                    <label for="{{ form.task_name.id_for_label }}" class="form-label fw-semibold">Name</label>
                    <input type="text" 
                           name="{{ form.task_name.name }}" 
                           id="{{ form.task_name.id_for_label }}" 
                           class="form-control" 
                           placeholder="ex: Water the flowers"
                           required>
                </div>

                <div class="mb-4 text-start">
                    <label for="{{ form.task_deadline.id_for_label }}" class="form-label fw-semibold"> Deadline </label>
                    <input type="datetime-local" 
                           name="{{ form.task_deadline.name }}" 
                           id="{{ form.task_deadline.id_for_label }}" 
                           class="form-control">
                </div>

                <button type="submit" class="btn text-white w-100 py-2 fw-semibold shadow-sm" style="background-color: #3B5550; border-radius: 8px;">
                    Save Task
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
